<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vidlink</title>
<style>
  :root{--bg:#0b0b10;--card:#15151d;--line:#2a2a38;--text:#ececf1;--muted:#8a8aa0;--accent:#7c5cff;--ok:#3ddc97;--bad:#ff6b6b}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,sans-serif}
  main{max-width:560px;margin:0 auto;padding:48px 16px}
  h1{margin:0 0 4px;font-size:28px;letter-spacing:-.5px}
  p.sub{margin:0 0 28px;color:var(--muted)}
  #drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:44px 20px;text-align:center;cursor:pointer;background:var(--card);transition:.15s}
  #drop:hover,#drop.over{border-color:var(--accent);background:#1b1828}
  #drop strong{display:block;font-size:18px;margin-bottom:4px}
  #drop span{color:var(--muted);font-size:14px}
  input[type=file]{display:none}
  input[type=password]{width:100%;margin:0 0 14px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:20px 0 6px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
  #status{color:var(--muted);font-size:14px;min-height:21px}
  #status.bad{color:var(--bad)}
  .result{margin-top:22px;display:none}
  .row{display:flex;gap:8px;margin-bottom:10px}
  .row input{flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:14px ui-monospace,monospace}
  button{padding:0 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 14px system-ui;cursor:pointer}
  button.ghost{background:var(--line)}
  label.small{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>vidlink</h1>
  <p class="sub">Drop a video (up to 500 MB), get a link that plays right inside Discord.</p>

  <input id="pw" type="password" class="hidden" placeholder="Upload password" autocomplete="current-password">

  <label id="drop" for="file">
    <strong>Drop a video here</strong>
    <span>or click to pick one · mp4 / webm embed best</span>
  </label>
  <input id="file" type="file" accept="video/*,.mkv,.mov">

  <div class="bar hidden" id="bar"><i></i></div>
  <div id="status"></div>

  <div class="result" id="result">
    <label class="small">Share link (paste this in Discord)</label>
    <div class="row"><input id="page" readonly><button data-copy="page">Copy</button></div>
    <label class="small">Direct file link</label>
    <div class="row"><input id="direct" readonly><button class="ghost" data-copy="direct">Copy</button></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const MAX = 500 * 1024 * 1024;
let needsPassword = false;

fetch("/api/config").then(r => r.json()).then(c => {
  needsPassword = c.needsPassword;
  $("pw").classList.toggle("hidden", !needsPassword);
  try { $("pw").value = localStorage.getItem("vidlink-pw") || ""; } catch {}
}).catch(() => {});

const setStatus = (msg, bad) => { $("status").textContent = msg; $("status").className = bad ? "bad" : ""; };
const mb = (b) => (b / 1048576).toFixed(1) + " MB";

// Read width/height in the browser so the server can tell Discord the right aspect ratio.
function probe(file) {
  return new Promise((resolve) => {
    const v = document.createElement("video");
    const url = URL.createObjectURL(file);
    const done = (dims) => { URL.revokeObjectURL(url); resolve(dims); };
    v.preload = "metadata";
    v.onloadedmetadata = () => done({ width: v.videoWidth, height: v.videoHeight });
    v.onerror = () => done({});
    setTimeout(() => done({}), 4000);
    v.src = url;
  });
}

async function send(file) {
  if (!file) return;
  if (file.size > MAX) return setStatus(`That's ${mb(file.size)}, the limit is 500 MB.`, true);
  if (needsPassword && !$("pw").value) return setStatus("Enter the upload password first.", true);

  $("result").style.display = "none";
  $("bar").classList.remove("hidden");
  $("bar").firstElementChild.style.width = "0";
  setStatus("Reading video…");

  const dims = await probe(file);
  const form = new FormData();
  if (dims.width) form.append("width", dims.width);
  if (dims.height) form.append("height", dims.height);
  form.append("video", file); // fields before the file so the server sees them

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload");
  if (needsPassword) xhr.setRequestHeader("x-upload-password", $("pw").value);
  xhr.upload.onprogress = (e) => {
    if (!e.lengthComputable) return;
    const pct = (e.loaded / e.total) * 100;
    $("bar").firstElementChild.style.width = pct + "%";
    setStatus(`Uploading… ${pct.toFixed(0)}% (${mb(e.loaded)} / ${mb(e.total)})`);
  };
  xhr.onload = () => {
    let data = {};
    try { data = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status !== 200) return setStatus(data.error || `Upload failed (${xhr.status}).`, true);
    if (needsPassword) try { localStorage.setItem("vidlink-pw", $("pw").value); } catch {}
    $("page").value = data.page;
    $("direct").value = data.direct;
    $("result").style.display = "block";
    setStatus("Done ✓");
  };
  xhr.onerror = () => setStatus("Network error, upload didn't make it.", true);
  xhr.send(form);
}

$("file").onchange = (e) => send(e.target.files[0]);
const drop = $("drop");
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => send(e.dataTransfer.files[0]));
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { if (!drop.contains(e.target)) { e.preventDefault(); send(e.dataTransfer.files[0]); } });

document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
  const input = $(b.dataset.copy);
  input.select();
  try { await navigator.clipboard.writeText(input.value); } catch { document.execCommand("copy"); }
  const t = b.textContent; b.textContent = "Copied!"; setTimeout(() => b.textContent = t, 1200);
});
</script>
</body>
</html>
